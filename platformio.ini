[env:m5stack-coreink]
platform = espressif32 @ 6.4.0
board = m5stack-coreink
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    m5stack/M5GFX
    m5stack/M5Core-Ink
    boschsensortec/BSEC Software Library@^1.8.1492
    bblanchon/ArduinoJson@^6.21.3

build_flags = 
    -D CORE_DEBUG_LEVEL=0